<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Diagnostic – TSSR Lab</title>
<link rel="stylesheet" href="assets/style.css">
<style>
/* Assistant */
.sympt{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sympt button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:14px;border-radius:12px;background:var(--card);height:100%}
.sympt button .ic{font-size:24px}
.sympt button b{font-size:15px}
.sympt button span.d{color:var(--muted);font-size:13px}
.sympt button:hover{background:var(--acc-soft)}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin-bottom:12px}
.trail span.s{background:var(--acc-soft);color:var(--acc);padding:2px 9px;border-radius:999px}
.step-n{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.wq{font-size:19px;font-weight:650;margin:2px 0 8px}
.answers{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.answers button{justify-content:flex-start;text-align:left;padding:11px 14px;border-radius:10px;background:var(--card);font-size:15px}
.answers button:hover{background:var(--acc-soft)}
.answers button::before{content:"→";color:var(--acc);font-weight:700}
.cmdl{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.cmd{display:flex;gap:6px;align-items:flex-start}
.cmd code{flex:1;background:var(--code);color:var(--code-txt);padding:6px 9px;border-radius:6px;font:13px/1.45 ui-monospace,Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-all;cursor:copy}
.cmd button{padding:4px 8px;font-size:12px;flex:none}
.res-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res-h h2{margin:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.meta div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.meta div b{display:block;font-size:14px}
</style>
<script src="assets/app.js"></script>
</head>
<body>
<header id="site-head" data-page="diag"></header>

<main>
<section id="tab-wz">
  <div class="pagehead">
    <h1>Assistant de dépannage</h1>
    <p>Choisis le symptôme décrit par l'utilisateur. Réponds aux questions : l'assistant te donne la cause probable, les commandes et le ticket GLPI prêt à copier.</p>
  </div>
  <div id="wz"></div>
</section>
<details class="card" id="varsBox" style="margin-top:16px"><summary>⚙️ Variables (plan d'adressage)</summary><p class="muted">Les commandes de l'assistant et de la page <a href="commandes.html">Commandes</a> utilisent ces valeurs.</p><div class="vars" id="vars"></div></details>

</main>

<script src="assets/data-diag.js"></script>
<script>
(function(){
  const {load, store, copy, esc, fill, vars} = TSSR;

  // Variables : un changement réaffiche l'étape en cours
  TSSR.varsPanel(document.getElementById('vars'), null, () => { if(path.length) go(path[path.length - 1].node, true); });

  // Ligne de commande copiable
  function cmdHTML(list){
    const v = vars();
    return '<div class="cmdl">' + list.map(c => `<div class="cmd"><code title="Cliquer pour copier">${esc(fill(c, v))}</code><button>Copier</button></div>`).join('') + '</div>';
  }
  function wireCmds(scope){
    scope.querySelectorAll('.cmd').forEach(r => {
      const code = r.querySelector('code'), b = r.querySelector('button');
      code.onclick = b.onclick = () => copy(code.textContent, b);
    });
  }

  // ================= Assistant =================
  const wz = document.getElementById('wz');
  let path = [];   // [{node, answer}]
  let cur = null;
  const startName = id => (DIAG_START.find(s => s[0] === id) || [,,id])[2];
  const strip = h => h.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

  function renderStart(){
    path = []; cur = null;
    wz.innerHTML = '<div class="sympt">' + DIAG_START.map(s =>
      `<button data-id="${s[0]}"><span class="ic">${s[1]}</span><b>${s[2]}</b><span class="d">${s[3]}</span></button>`).join('') + '</div>' +
      `<p class="muted" style="margin-top:14px">Les commandes utilisent tes <a href="#varsBox" id="goVars">variables</a> (domaine, serveurs, IP). Besoin d'une commande précise ? <a href="commandes.html">Toutes les commandes</a>.</p>`;
    wz.querySelectorAll('.sympt button').forEach(b => b.onclick = () => { path = [{node:b.dataset.id, answer:null, label:startName(b.dataset.id)}]; go(b.dataset.id); });
    document.getElementById('goVars').onclick = () => { document.getElementById('varsBox').open = true; };
  }

  function trailHTML(){
    return '<div class="trail"><span class="s">' + esc(path[0].label) + '</span>' +
      path.slice(1).map(p => `<span>›</span><span>${esc(p.answer)}</span>`).join('') + '</div>';
  }
  function navHTML(){
    return `<div class="bar" style="margin-top:16px"><button id="wBack">← Retour</button><button id="wRestart">↺ Nouveau diagnostic</button></div>`;
  }
  function wireNav(){
    document.getElementById('wBack').onclick = () => {
      if(path.length <= 1){ renderStart(); return; }
      path.pop(); go(path[path.length - 1].node, true);
    };
    document.getElementById('wRestart').onclick = renderStart;
  }

  function go(id, back){
    const n = DIAG[id]; cur = id;
    if(!n){ wz.innerHTML = '<div class="card badbox">Étape introuvable : ' + esc(id) + '</div>'; return; }
    if(n.r){ renderResult(n, back); return; }
    const step = path.length;
    wz.innerHTML = `<div class="card">${trailHTML()}
      <div class="step-n">Étape ${step}</div>
      <div class="wq">${n.q}</div>
      ${n.h ? `<p class="muted" style="margin:0 0 4px">${fill(n.h, vars())}</p>` : ''}
      ${n.c ? cmdHTML(n.c) : ''}
      <div class="answers">${n.o.map((o, i) => `<button data-i="${i}">${esc(fill(o[0], vars()))}</button>`).join('')}</div>
      ${navHTML()}</div>`;
    wz.querySelectorAll('.answers button').forEach(b => b.onclick = () => {
      const o = n.o[+b.dataset.i];
      path.push({node:o[1], answer:fill(o[0], vars()), q:strip(n.q)});
      go(o[1]);
    });
    wireCmds(wz); wireNav();
    if(!back) wz.scrollIntoView({block:'start', behavior:'smooth'});
  }

  function ticketText(n){
    const v = vars(), t = n.t;
    const diag = path.slice(1).map(p => `- ${p.q} → ${p.answer}`).join('\n');
    return fill(
`Titre : ${t.titre}
Type : ${t.type}   Catégorie : ${t.cat}   Urgence : ${t.u}   Impact : ${t.i}

Symptôme signalé : ${path[0].label}
Diagnostic :
${diag || '- (aucun test)'}

Cause identifiée : ${n.r}
Actions réalisées :
${n.fix.map((f, i) => `${i + 1}. ${strip(f)}`).join('\n')}
Vérification : ${strip(n.v || '')}

--- Solution ---
${t.sol}`, v);
  }

  function renderResult(n, back){
    const v = vars();
    const hist = TSSR.loadJ('diag_hist', []);
    if(!back){ hist.unshift({d:Date.now(), s:path[0].label, r:n.r}); TSSR.saveJ('diag_hist', hist.slice(0, 30)); }
    wz.innerHTML = `<div class="card">${trailHTML()}
      <div class="res-h"><span class="pill ok">Cause probable</span><h2>${esc(n.r)}</h2></div>
      <div class="meta">
        <div>Type<b>${n.t.type}</b></div><div>Urgence<b>${n.t.u}</b></div><div>Impact<b>${n.t.i}</b></div><div>Catégorie<b>${esc(n.t.cat)}</b></div>
      </div>
      <h3>Résolution</h3><ol class="prob">${n.fix.map(f => `<li>${fill(f, v)}</li>`).join('')}</ol>
      ${n.c ? '<h3>Commandes</h3>' + cmdHTML(n.c) : ''}
      ${n.v ? `<div class="okbox"><b>Vérification :</b> ${fill(n.v, v)}</div>` : ''}
      <h3>Ticket GLPI prêt à coller</h3>
      <pre><code id="tk"></code></pre>
      <div class="tip">À l'examen : dis chaque hypothèse à voix haute, note chaque test dans le ticket, fais valider l'utilisateur avant de passer en <i>Résolu</i>.</div>
      ${navHTML()}</div>`;
    document.getElementById('tk').textContent = ticketText(n);
    wireCmds(wz); wireNav(); TSSR.addCopyButtons(wz);
    if(!back) wz.scrollIntoView({block:'start', behavior:'smooth'});
  }
  renderStart();

})();
</script>
</body>
</html>
